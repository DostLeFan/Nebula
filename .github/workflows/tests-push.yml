name: Tests (Push)

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Configure
        run: cmake --preset release -DNEBULA_BUILD_TEST=ON -DNEBULA_BUILD_EMULATOR_APP=OFF -DNEBULA_BUILD_NODE=OFF

      - name: Build
        run: cmake --build --preset release

      - name: Run tests
        run: ctest --test-dir build/release --output-on-failure